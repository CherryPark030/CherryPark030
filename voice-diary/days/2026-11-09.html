<script>
const W = 1080, H = 1350;
const FONT = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const INK = '#1d1d1d', PAPER = '#f8f8f6', RED = '#c2410c';

const EXAMPLE = {
  "date": "2026-11-09",
  "mood": "tired",
  "cover": {
    "title": "주말 내내 집에 있던 사람은\n무엇과 싸우고 있었나?"
  },
  "cards": [
    {
      "headline": "“말이 막힐까 봐,\n그게 제일 걱정이에요”",

      "quote": "사람들 앞에 선다고 생각만 해도 말이 잘 안 나와요. 혼자 연습할 때도 그게 계속 걱정됐어요. **중간에 말이 끊기거나 문법이 틀릴까 봐 불안해요.** 상담도 코칭도 받아 봤지만 크게 달라지진 않았어요."
    },
    {
      "headline": "“직업은 다양하게\n경험해 볼수록 좋은 것”",
      "intro": "3년 넘게 서비스 기획자로 일하다 최근 글로벌 마케터로 직무를 바꾼 체리는, 그 전부터 새로운 커리어에 대한 궁금증을 품고 있었다고 한다.",
      "speaker": "",
      "quote": "다른 길을 한번 고민해 보고 싶었어요. **저한테 직업은 많이 경험해 보고 싶은 것, 다양할수록 좋은 거예요.** 다른 언어를 배우고 그걸로 사람들이랑 소통하는 걸 좋아해서 자연스럽게 이 시험에 관심이 갔어요."
    },
    {
      "headline": "“다 보진 못했지만,\n그래도 확인은 했어요”",
      "intro": "집중이 잘 되지 않았다는 하루였지만, 체리는 스스로 칭찬할 만한 일 하나를 꼽았다.",
      "speaker": "",
      "quote": "유네스코 문화유산이랑 기록유산은 한 번씩 다 훑어봤어요. 인류무형유산은 가장 중요한 네 가지만 뽑아서 봤고요. **그래도 확인했다는 것, 그게 제일 중요한 것 같아요.**"
    },
    {
      "headline": "“그런 결정을 조금 더\n빠르게 내려도 좋겠다”",
      "intro": "체리는 손으로 쓰고, 타이핑하고, AI 도구까지 바꿔 가며 공부법을 찾았다고 한다. 그 과정에서 자신에 대해 하나를 알게 됐다.",
      "speaker": "",
      "quote": "결제하기 전에 무료로 할 수 있는 방법을 최대한 찾아보다가 결국 돌아가곤 해요. 짧은 시간에 효율을 내려면 처음부터 결제했어야 했나 싶어서 아쉬웠어요. **돈 쓰는 데 생각보다 오래 고민하는 나를, 조금은 놓아줘도 될 것 같아요.**"
    }
  ],
  "closing": {
    "headline": "불안을 안고서도\n한 걸음씩 나아간 주말",
    "body": "체리는 걱정이 더 크다고 솔직하게 말했다. 그래도 오래된 불안을 안고 새로운 길에 도전하고 있다. 인터뷰 내내 중간중간 말을 고르면서도 그녀의 생각은 하나도 빠짐없이 전해졌다. **완벽하게 말하지 않아도 마음은 충분히 닿는다.** 다음 주 토요일, 그녀가 준비한 만큼 말할 수 있기를."
  },
  "caption": "시험 앞둔 주말, 집에서 나와 싸운 기록.\n완벽하지 않아도 한 걸음씩.\n\n#말로쓰는일기 #일기 #관광통역안내사 #시험준비 #벼락치기"
};

const MOODS = {
  happy:   { base: '#3a1d1f', blobs: ['#ffb36b', '#ff7e8a', '#ffe29a', '#ff9f68'] },
  calm:    { base: '#17323a', blobs: ['#7fb7be', '#d3e3c8', '#4f8a96', '#a9cfd2'] },
  tired:   { base: '#24243a', blobs: ['#8c8fa8', '#c9b8d9', '#5b5f86', '#e3c9d6'] },
  angry:   { base: '#2e0f0c', blobs: ['#d9483b', '#f2a65a', '#8c2a1f', '#ffcf7a'] },
  sad:     { base: '#101a2c', blobs: ['#4a6fa5', '#9bb7d4', '#2b4370', '#7d8fb3'] },
  excited: { base: '#2a1438', blobs: ['#f25f9c', '#ffd166', '#6a4c93', '#ff9671'] },
};

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let data = null, photo = null, canvases = [];

/* ---------- rich text ---------- */
function runs(text) {           // "**bold**" → [{t, b}]
  const out = [];
  String(text || '').split(/(\*\*[^*]+\*\*)/).forEach(p => {
    if (!p) return;
    if (p.startsWith('**') && p.endsWith('**')) out.push({ t: p.slice(2, -2), b: true });
    else out.push({ t: p, b: false });
  });
  return out;
}
function fontFor(r, size) { return `${r.b ? 700 : 400} ${size}px ${FONT}`; }

/* lay out paragraphs of runs into lines; returns {lines, height} */
function layout(ctx, paras, size, maxW, lh) {
  const lines = [];
  paras.forEach((para, pi) => {
    // tokens: words and spaces, each keeps style
    const toks = [];
    para.forEach(r => r.t.split(/(\s+)/).forEach(w => { if (w) toks.push({ t: w.replace(/\s+/g, ' '), b: r.b, c: r.c }); }));
    let line = [], lw = 0;
    const push = () => { while (line.length && line[line.length - 1].t === ' ') line.pop(); lines.push(line); line = []; lw = 0; };
    for (const tk of toks) {
      ctx.font = fontFor(tk, size);
      const w = ctx.measureText(tk.t).width;
      if (tk.t === ' ' && line.length === 0) continue;
      if (lw + w > maxW && line.length) push();
      if (w > maxW) {                      // very long word: break by char
        for (const ch of tk.t) {
          const cw = ctx.measureText(ch).width;
          if (lw + cw > maxW) push();
          line.push({ ...tk, t: ch, w: cw }); lw += cw;
        }
      } else if (!(tk.t === ' ' && line.length === 0)) { line.push({ ...tk, w }); lw += w; }
    }
    push();
    if (pi < paras.length - 1) lines.push('gap');
  });
  const height = lines.reduce((h, l) => h + (l === 'gap' ? size * lh * 0.9 : size * lh), 0);
  return { lines, height };
}
function drawLines(ctx, lines, x, y, size, lh, color) {
  ctx.textBaseline = 'alphabetic';
  for (const l of lines) {
    if (l === 'gap') { y += size * lh * 0.9; continue; }
    let cx = x;
    for (const tk of l) { ctx.font = fontFor(tk, size); ctx.fillStyle = tk.c || color; ctx.fillText(tk.t, cx, y + size); cx += tk.w; }
    y += size * lh;
  }
  return y;
}
function centered(ctx, text, y, size, weight, color) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = 'center';
  String(text || '').split('\n').forEach((t, i) => ctx.fillText(t, W / 2, y + size + i * size * 1.38));
  ctx.textAlign = 'left';
  return y + String(text || '').split('\n').length * size * 1.38;
}

/* ---------- cards ---------- */
function paperCard(ctx, brand, pageNo) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.font = `900 34px ${FONT}`; ctx.fillStyle = INK; ctx.fillText(brand, 72, 118);
  ctx.font = `italic 34px Georgia, "Times New Roman", serif`; ctx.fillStyle = INK; ctx.textAlign = 'center';
  ctx.fillText(String(pageNo), W / 2, H - 70); ctx.textAlign = 'left';
}
function bodyBlock(ctx, paras, top) {
  const maxW = W - 144, bottom = H - 150, lh = 1.75;
  let size = 31, L;
  do { L = layout(ctx, paras, size, maxW, lh); if (top + L.height <= bottom) break; size -= 1; } while (size > 20);
  drawLines(ctx, L.lines, 72, top, size, lh, INK);
}
function headline(ctx, text, top) {
  let size = 54;
  const longest = Math.max(...String(text).split('\n').map(s => s.length));
  if (longest > 16) size = Math.max(40, Math.floor(54 * 16 / longest));
  return centered(ctx, text, top, size, 900, INK);
}
function drawStory(ctx, c, brand, me, pageNo) {
  paperCard(ctx, brand, pageNo);
  const after = headline(ctx, c.headline, 190);
  const speaker = (c.speaker || me || '나').trim();
  const quote = runs(c.quote);
  quote.unshift({ t: speaker + ' ', b: true, c: RED });
  bodyBlock(ctx, [runs(c.intro), quote], after + 56);
}
function drawClosing(ctx, c, brand, pageNo) {
  paperCard(ctx, brand, pageNo);
  const after = headline(ctx, c.headline, 190);
  bodyBlock(ctx, String(c.body || '').split(/\n\s*\n/).map(runs), after + 56);
}
function drawCover(ctx, d, brand) {
  if (photo) {
    const s = Math.max(W / photo.width, H / photo.height);
    const w = photo.width * s, h = photo.height * s;
    ctx.drawImage(photo, (W - w) / 2, (H - h) / 2, w, h);
  } else {
    let key = $('mood').value; if (key === 'auto') key = d.mood;
    const m = MOODS[key] || MOODS.calm;
    ctx.fillStyle = m.base; ctx.fillRect(0, 0, W, H);
    const seed = [...(d.date || 'x')].reduce((a, ch) => a + ch.charCodeAt(0), 0);
    let r = seed; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
    m.blobs.forEach(col => {
      const x = rnd() * W, y = rnd() * H * 0.85, rad = 380 + rnd() * 420;
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, col + 'ee'); g.addColorStop(1, col + '00');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
    const img = ctx.getImageData(0, 0, W, H), px = img.data;   // film grain
    for (let i = 0; i < px.length; i += 4) { const n = (Math.random() - 0.5) * 26; px[i] += n; px[i + 1] += n; px[i + 2] += n; }
    ctx.putImageData(img, 0, 0);
    if (d.date) {
      const [, mm, dd] = d.date.split('-');
      ctx.font = `900 220px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillText(`${+mm}.${dd}`, 60, 300);
    }
  }
  const g = ctx.createLinearGradient(0, H * 0.45, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const lines = String(d.cover?.title || '').split('\n');
  const size = 66;
  ctx.font = `900 ${size}px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18;
  const top = H - 230 - lines.length * size * 1.3;
  lines.forEach((t, i) => ctx.fillText(t, 72, top + size + i * size * 1.3));
  ctx.shadowBlur = 0;
  ctx.font = `900 30px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText(brand, W / 2, H - 92); ctx.textAlign = 'left';
}

/* ---------- app ---------- */
function parse(text) {
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('{ 로 시작하는 일기 데이터를 찾지 못했어요. Claude가 준 코드 블록 전체를 붙여 넣어 주세요.');
  let d;
  try { d = JSON.parse(m[0]); } catch { throw new Error('형식이 조금 깨져 있어요. 코드 블록을 처음부터 끝까지 다시 복사해 주세요.'); }
  if (!d.cover || !Array.isArray(d.cards)) throw new Error('cover 와 cards 항목이 필요해요. Claude에게 "카드 형식으로 다시 줘"라고 해 보세요.');
  return d;
}
async function fonts(text) {
  if (!document.fonts) return;
  const chars = [...new Set(text + '오늘의체리 0123456789')].join('');
  try { await Promise.all(['400', '700', '900'].map(w => document.fonts.load(`${w} 40px "Noto Sans KR"`, chars))); } catch {}
}
async function render() {
  const brand = $('brand').value.trim() || '오늘의 체리', me = $('me').value.trim() || '체리';
  await fonts(JSON.stringify(data) + brand + me);
  const pages = [ctx => drawCover(ctx, data, brand)];
  data.cards.forEach((c, i) => pages.push(ctx => drawStory(ctx, c, brand, me, i + 1)));
  if (data.closing) pages.push(ctx => drawClosing(ctx, data.closing, brand, data.cards.length + 1));
  const track = $('track'); track.innerHTML = ''; canvases = [];
  pages.forEach((draw, i) => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', `카드 ${i + 1}`);
    draw(cv.getContext('2d')); track.appendChild(cv); canvases.push(cv);
  });
  $('dots').innerHTML = canvases.map((_, i) => `<span class="${i ? '' : 'on'}"></span>`).join('');
  $('count').textContent = `1/${canvases.length}`;
  $('thumbs').innerHTML = '';
  canvases.forEach((cv, i) => { const im = new Image(); im.src = cv.toDataURL('image/png'); im.alt = `카드 ${i + 1}`; $('thumbs').appendChild(im); });
  $('cap').textContent = data.caption || '';
  $('copyCap').hidden = !data.caption;
}
function run() {
  const msg = $('srcMsg'); msg.className = 'msg'; msg.textContent = '';
  try { data = parse($('src').value); }
  catch (e) { msg.className = 'msg err'; msg.textContent = e.message; return; }
  
  store.set('vd-src', $('src').value);
  render();
}

$('track').addEventListener('scroll', () => {
  const i = Math.round($('track').scrollLeft / $('track').clientWidth);
  $('count').textContent = `${i + 1}/${canvases.length}`;
  [...$('dots').children].forEach((s, k) => s.classList.toggle('on', k === i));
}, { passive: true });
$('render').onclick = run;
$('reset').onclick = () => { $('src').value = JSON.stringify(EXAMPLE, null, 2); run(); };
$('photo').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => { photo = im; data && render(); }; im.src = rd.result; };
  rd.readAsDataURL(f);
};
$('noPhoto').onclick = () => { photo = null; $('photo').value = ''; data && render(); };
$('mood').onchange = () => data && render();
['brand', 'me'].forEach(id => $(id).addEventListener('change', () => { store.set('vd-' + id, $(id).value); data && render(); }));

$('copyCap').onclick = async () => {
  try { await navigator.clipboard.writeText(data.caption); $('saveMsg').textContent = '캡션을 복사했어요.'; }
  catch { const r = document.createRange(); r.selectNodeContents($('cap')); getSelection().removeAllRanges(); getSelection().addRange(r); $('saveMsg').textContent = '캡션을 선택해 뒀어요. 복사를 눌러 주세요.'; }
};

let downloads = null;
$('saveAll').hidden = true;
(async () => {
  try { downloads = await window.claude?.use?.('downloads'); } catch { downloads = null; }
  if (downloads) $('saveAll').hidden = false;
})();
$('saveAll').onclick = async () => {
  const day = (data.date || 'diary').replace(/-/g, '');
  for (let i = 0; i < canvases.length; i++) {
    const blob = await new Promise(r => canvases[i].toBlob(r, 'image/png'));
    try {
      await downloads.save({ filename: `${day}_${i + 1}.png`, data: blob });
      $('saveMsg').textContent = `${i + 1}/${canvases.length}장 저장했어요.`;
    } catch (e) {
      $('saveMsg').textContent = e?.code === 'declined' ? `${i + 1}번째 카드에서 저장을 멈췄어요.` : '여기서는 저장이 안 돼요. 아래 이미지를 길게 눌러 저장하세요.';
      return;
    }
  }
};

$('brand').value = store.get('vd-brand') || '오늘의 체리';
$('me').value = store.get('vd-me') || '체리';
$('src').value = store.get('vd-src') || JSON.stringify(EXAMPLE, null, 2);
run();
</script>
